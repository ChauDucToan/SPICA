defaults:
  - _self_

experiment_name: train_deterministic_k3_m3_b32
data_config: configs/data/sketchy_104_21.yaml
model_name: ViT-B-32-quickgelu
pretrained: openai
device: auto
embedding_dim: 512
hidden_dim: 512
num_positive_photos: 3
batch_size: 32
num_workers: 4
pin_memory: true
drop_last: false
learning_rate: 0.001
weight_decay: 0.0001
margin: 0.2
gate_prior_weight: 0.0
anchor_weight: 0.0
diversity_weight: 0.0
max_steps: 100
log_every: 10
seed: 42
checkpoint_path: null
hydra:
  job:
    chdir: false
  run:
    dir: "outputs/experiments/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}"
  output_subdir: .hydra
