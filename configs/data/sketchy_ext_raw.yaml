# This is config file for sketchy with split 104/21
version: 1.0

name: sketchy_ext_raw
data:
  root: datasets/Sketchy_ext_raw
  sketch_dir: sketch
  photo_dir: photo

  ignore_dirs:
    - .ipynb_checkpoints

  unseen_classes:
    - bat
    - cabin
    - cow
    - dolphin
    - door
    - giraffe
    - helicopter
    - mouse
    - pear
    - raccoon
    - rhinoceros
    - saw
    - scissors
    - seagull
    - skyscraper
    - songbird
    - sword
    - tree
    - wheelchair
    - windmill
    - window
