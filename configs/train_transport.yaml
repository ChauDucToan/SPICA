defaults:
  - _self_

experiment_name: transport_tangent_k1_${encoder_mode}_rho${rho_max_degrees}
model_family: predictive_semantic_transport
# Structured semantic role used by integrity-aware summarizers; never inferred
# from experiment_name.
experiment_role: null
experiment_campaign: null

data_config: configs/data/sketchy_104_21.yaml
embedding_dir: outputs/sketchy_104_21/clip_openai_quickgelu
model_name: ViT-B-32-quickgelu
pretrained: openai
device: auto

# The hidden state is the pooled visual state before CLIP's visual projection.
# The photo encoder supplies the frozen projection matrix used to make z0.
encoder_mode: partial
encoder_unfreeze_depth: 4
predictor_hidden_dim: 512
use_z0: false

transport_mode: tangent
# False is the matched base-query control (q=z0); it keeps the same encoder
# and ranking harness without putting a transport head in the loss graph.
transport_enabled: true
K: 1
rho_mode: shared
# P3 controls: learned, zero, fixed, linear_warmup, or cosine_warmup.
# Non-learned controls do not instantiate a distance head.
rho_strategy: learned
fixed_rho_degrees: 15.0
rho_warmup_steps: 75
rho_max_degrees: 45.0
# A tiny non-zero warm start avoids a sigmoid-at-zero gradient stall while
# remaining effectively at z0 for step-0 retrieval (learned strategy only).
initial_rho_degrees: 0.5
# Residual controls use these values; tangent runs ignore alpha.
alpha: 1.0
alpha_max: 0.5
initial_alpha: 0.0

# K>1 vMF is a distribution over tangent directions only.
use_vmf: false
min_kappa: 0.0001
max_kappa: 2048.0
initial_kappa: 64.0

num_positive_photos: 1
# instance is the primary target. class_prototype is a train-photo-only control.
photo_target: instance
batch_size: 32
num_workers: 4
pin_memory: true
drop_last: true

predictor_learning_rate: 0.0001
encoder_learning_rate: 0.00001
weight_decay: 0.0001
margin: 0.2
loss_profile: transport
lambda_dir: 1.0
lambda_dist: 1.0
lambda_endpoint: 1.0
lambda_rank: 1.0
lambda_cls: 0.0
# Semantic-anchor probe: q, z0, both (0.5/0.5), or none.
text_loss_location: q
lambda_vmf: 0.0
lambda_geom: 0.0
use_geometry_loss: false
# Direction target probe: moving, fixed_reference, class_centroid, or none.
direction_target: moving
# Cap the number of actual sampled pair angles retained in run_result.
training_angle_diagnostic_max: 8192

tau_cls: 0.07
prompt_template: a photo of a {}
assignment_temperature: 0.05
score_temperature: 0.07
inference_score_mode: barycentric

# Pseudo-unseen model selection: 84 training classes / 20 validation classes.
train_class_scope: pseudo_train
pseudo_val_num_classes: 20
pseudo_val_seed: 3407

max_steps: 100
log_every: 10
probe_steps: [100]
# When set, these offsets are added to the loaded checkpoint step.  They are
# intentionally separate from absolute global probe_steps.
probe_step_offsets: null
run_probes: true
eval_batch_size: 128
prediction_batch_size: 128
query_chunk_size: 256
precision_at_k: [1, 5, 10, 100, 200]
map_at_k: [200]
map_at_k_denominator: prefix_positive
save_optimizer: false
# Optional exact-checkpoint continuation used by freeze-after-warmup controls.
resume_checkpoint_path: null
# Continuation controls. reset scope can isolate encoder/head optimizer state.
reset_optimizer_on_resume: false
optimizer_reset_scope: none
reset_transport_head_on_resume: false
# Semantic Stage-2 control: freeze immediately after loading the resume state.
freeze_encoder_on_resume: false
freeze_encoder_at_step: null
# Stage-1 selection manifest consumed by corrected two-stage runs.
stage1_selection_manifest_path: null
# Gradient conflict is intentionally sparse; these are not per-iteration logs.
gradient_conflict_steps: [15, 73, 500]
seed: 42
checkpoint_path: null

wandb_project: spica
wandb_entity: null
wandb_group: spica-transport
wandb_run_name: null
wandb_mode: disabled

hydra:
  job:
    chdir: false
  run:
    dir: "outputs/experiments/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}"
  sweep:
    dir: "outputs/experiments/transport/${now:%Y-%m-%d_%H-%M-%S}"
    subdir: "${hydra.job.num}"
  output_subdir: .hydra
