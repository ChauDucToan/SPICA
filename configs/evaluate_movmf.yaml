defaults:
  - _self_

experiment_name: evaluate_movmf_k${num_components}_b32

checkpoint_path: ???
num_components: ???
embedding_dir: outputs/sketchy_104_21/clip_openai_quickgelu
data_config: configs/data/sketchy_104_21.yaml

dataset_name: sketchy_104_21
model_name: ViT-B-32-quickgelu
pretrained: openai
device: auto
# Stage-E commands should pass semantic_barycenter explicitly for matched
# retrieval; density remains the historical generic evaluator default.
scoring_rule: density
temperature: 0.05

prediction_batch_size: 512
query_chunk_size: 64
baseline_query_chunk_size: 256
responsibility_query_chunk_size: 64
precision_at_k:
  - 1
  - 5
  - 10
  - 100
  - 200
map_at_k:
  - 1
  - 5
  - 10
  - 100
  - 200
# Historical SPICA AP@K uses positives found in the prefix. Set to
# all_relevant or min_relevant_k for protocol auditing.
map_at_k_denominator: prefix_positive

hydra:
  job:
    chdir: false

  run:
    dir: "outputs/experiments/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}"

  sweep:
    dir: "outputs/experiments/movmf_k_sweep/evaluation/${now:%Y-%m-%d_%H-%M-%S}"
    subdir: "K${num_components}"

  output_subdir: .hydra
