# P6 is normally launched once the baseline is rerun with save_optimizer=true.
# The three freeze points are exact checkpoint continuations, not restarts.
# Override resume_checkpoint_path and freeze_encoder_at_step per run.
experiment_name: transport_freeze_after_warmup
transport_enabled: true
transport_mode: tangent
K: 1
encoder_mode: partial
encoder_unfreeze_depth: 4
lambda_cls: 1.0
lambda_dir: 1.0
lambda_dist: 1.0
lambda_endpoint: 1.0
lambda_rank: 1.0
lambda_vmf: 0.0
lambda_geom: 0.0
use_geometry_loss: false
rho_max_degrees: 15.0
loss_profile: transport
max_steps: 5400
probe_steps: [44, 73, 100, 500, 1000, 1800, 5400]
run_probes: true
save_optimizer: true
freeze_encoder_at_step: 73
resume_checkpoint_path: null
seed: 42
train_class_scope: pseudo_train
