defaults:
  - _self_

experiment_name: train_movmf_k${num_components}_b32_smoke

data_config: configs/data/sketchy_104_21.yaml
model_name: ViT-B-32-quickgelu
pretrained: openai
device: auto

embedding_dim: 512
hidden_dim: 512
num_components: 2
min_concentration: 0.0001
max_concentration: 2048.0
initial_concentration: 512.0
component_init_std: 0.0001

batch_size: 32
num_workers: 4
pin_memory: true
drop_last: false

learning_rate: 0.001
weight_decay: 0.0001
margin: 0.2
nll_weight: 0.001953125  # 1 / embedding_dim
ranking_weight: 1.0
max_steps: 100
log_every: 10
seed: 42
checkpoint_path: null

hydra:
  job:
    chdir: false

  run:
    dir: "outputs/experiments/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}"

  sweep:
    dir: "outputs/experiments/movmf_k_sweep/multirun/${now:%Y-%m-%d_%H-%M-%S}"
    subdir: "K${num_components}"

  output_subdir: .hydra
