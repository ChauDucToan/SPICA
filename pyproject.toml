[project]
name = "spica"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hydra-core>=1.3.5",
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "open-clip-torch>=3,<4",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.3",
    "pillow>=12.3.0",
    "pyarrow>=25.0.0",
    "pyyaml>=6.0.3",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "tqdm>=4.68.4",
    "wandb>=0.28.1",
]

[project.optional-dependencies]
cuda = [
    "torch==2.13.0",
    "torchvision==0.28.0",
]
rocm = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "pytorch-triton-rocm==3.5.1",
]

[project.scripts]
spica-eval-clip = "spica.evaluate_clip:main"
spica-eval-deterministic = "spica.evaluate_deterministic:main"
spica-eval-deterministic-k3 = "spica.evaluate_deterministic_k3:main"
spica-eval-text-fusion = "spica.evaluate_text_fusion:main"
spica-eval-vmf = "spica.evaluate_vmf:main"
spica-eval-movmf = "spica.evaluate_movmf:main"
spica-eval-jepa = "spica.evaluate_jepa:main"
spica-train-deterministic = "spica.train_deterministic:main"
spica-train-deterministic-k3 = "spica.train_deterministic_k3:main"
spica-train-vmf = "spica.train_vmf:main"
spica-train-movmf = "spica.train_movmf:main"
spica-train-movmf-ablation = "spica.train_movmf_ablation:main"
spica-train-stageE-no-vmf = "spica.train_stageE_no_vmf:main"
spica-train-stageE-angular = "spica.train_stageE_angular:main"
spica-train-stageE-k1 = "spica.train_stageE_k1:main"
spica-train-jepa = "spica.train_jepa:main"
spica-eval-transport = "spica.evaluate_transport:main"
spica-train-transport = "spica.train_transport:main"
spica-train-frozen-prompt = "spica.train_frozen_prompt:main"
spica-eval-frozen-prompt = "spica.evaluate_frozen_prompt:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv]
package = true
conflicts = [
    [
        { extra = "cuda" },
        { extra = "rocm" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "cuda" },
    { index = "pytorch-rocm64", extra = "rocm" },
]
torchvision = [
    { index = "pytorch-cu130", extra = "cuda" },
    { index = "pytorch-rocm64", extra = "rocm" },
]
pytorch-triton-rocm = [
    { index = "pytorch-rocm64", extra = "rocm" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm64"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipython>=9.15.0",
    "jupyterlab>=4.6.1",
    "ruff>=0.15.21",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
